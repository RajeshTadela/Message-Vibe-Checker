version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./tone_checker.db
      - SAFE_THRESHOLD=30.0
      - CAUTION_THRESHOLD=60.0
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

